<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>CardBid AI</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 28px 16px;
      background: #0f1115;
      color: white;
      font-family: Arial, Helvetica, sans-serif;
    }

    .app {
      width: 100%;
      max-width: 460px;
      margin: 0 auto;
    }

    .brand {
      text-align: center;
      margin-bottom: 24px;
    }

    .brand h1 {
      margin: 0;
      font-size: 34px;
    }

    .brand p {
      margin: 8px 0 0;
      color: #9ca3af;
    }

    .panel {
      background: #191d24;
      border: 1px solid #2b3039;
      border-radius: 20px;
      padding: 20px;
      margin-bottom: 18px;
    }

    .upload {
      display: block;
      border: 2px dashed #3a414d;
      border-radius: 18px;
      padding: 24px;
      text-align: center;
      cursor: pointer;
    }

    input[type="file"] {
      display: none;
    }

    .card-preview {
      width: 100%;
      max-height: 340px;
      object-fit: contain;
      border-radius: 14px;
      margin-top: 14px;
      display: none;
      background: black;
    }

    .scan-button {
      width: 100%;
      margin-top: 15px;
      padding: 15px;
      border: none;
      border-radius: 14px;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
    }

    .status {
      text-align: center;
      color: #9ca3af;
      margin-top: 12px;
      min-height: 20px;
    }

    .result {
      display: none;
    }

    .identified {
      text-align: center;
      margin-bottom: 20px;
    }

    .identified h2 {
      margin: 0 0 8px;
    }

    .identified p {
      margin: 4px 0;
      color: #c9ced6;
    }

    .confidence {
      margin-top: 10px;
      font-size: 14px;
      color: #9ca3af;
    }

    .market-value {
      text-align: center;
      margin-bottom: 18px;
      padding: 14px;
      border-radius: 14px;
      background: #101318;
    }

    .market-value .label {
      color: #9ca3af;
      font-size: 14px;
    }

    .market-value .value {
      margin-top: 4px;
      font-size: 32px;
      font-weight: bold;
    }

    .traffic-light {
      display: grid;
      gap: 12px;
    }

    .light {
      padding: 20px;
      border-radius: 16px;
      text-align: center;
      font-size: 20px;
      font-weight: bold;
    }

    .green {
      background: #14a44d;
    }

    .yellow {
      background: #d8a300;
    }

    .red {
      background: #d9363e;
    }

    .range {
      display: block;
      margin-top: 6px;
      font-size: 26px;
    }

    .market-note {
      margin-top: 18px;
      padding-top: 16px;
      border-top: 1px solid #343a45;
      text-align: center;
      color: #bfc5ce;
      font-size: 14px;
      line-height: 1.5;
    }

    .footer {
      text-align: center;
      color: #6f7682;
      font-size: 12px;
      margin-top: 26px;
    }
  </style>
</head>

<body>

  <div class="app">

    <div class="brand">
      <h1>CardBid AI 🚦</h1>
      <p>Know when to bid.</p>
    </div>

    <div class="panel">

      <label class="upload" for="cardImage">
        <strong>📷 Scan Card</strong>
        <div style="margin-top:8px;color:#9ca3af;">
          Take a photo or upload a screenshot
        </div>
      </label>

      <input
        id="cardImage"
        type="file"
        accept="image/*"
        capture="environment"
      />

      <img
        id="preview"
        class="card-preview"
        alt="Card preview"
      />

      <button
        id="analyzeButton"
        class="scan-button"
      >
        Analyze Card
      </button>

      <div id="status" class="status"></div>

    </div>

    <div id="result" class="panel result">

      <div class="identified">
        <h2>Card Identified ✓</h2>

        <p><strong>Drake Maye</strong></p>
        <p>2024 Panini Prizm</p>
        <p>#329 • Silver Prizm • Rookie</p>

        <div class="confidence">
          Identification confidence: 96%
        </div>
      </div>

      <div class="market-value">
        <div class="label">
          Estimated Market Value
        </div>

        <div
          id="marketValueDisplay"
          class="value"
        >
          $175
        </div>
      </div>

      <div class="traffic-light">

        <div class="light green">
          🟢 STRONG BUY
          <span
            id="greenRange"
            class="range"
          >
            ≤ $140
          </span>
        </div>

        <div class="light yellow">
          🟡 FAIR BUY
          <span
            id="yellowRange"
            class="range"
          >
            $141–$175
          </span>
        </div>

        <div class="light red">
          🔴 OVER MARKET
          <span
            id="redRange"
            class="range"
          >
            $176+
          </span>
        </div>

      </div>

      <div class="market-note">
        Based on recent comparable sales
      </div>

    </div>

    <div class="footer">
      CardBid AI Prototype v0.2
    </div>

  </div>

  <script>

    const cardImage =
      document.getElementById("cardImage");

    const preview =
      document.getElementById("preview");

    const analyzeButton =
      document.getElementById("analyzeButton");

    const result =
      document.getElementById("result");

    const status =
      document.getElementById("status");


    /*
      TEMPORARY PROTOTYPE VALUE

      Later this number will come from
      real sold-card data automatically.
    */

    const marketValue = 175;


    cardImage.addEventListener(
      "change",
      function () {

        const file =
          cardImage.files[0];

        if (!file) {
          return;
        }

        preview.src =
          URL.createObjectURL(file);

        preview.style.display =
          "block";

        status.textContent =
          "Card image loaded.";

      }
    );


    analyzeButton.addEventListener(
      "click",
      function () {

        if (!cardImage.files.length) {

          status.textContent =
            "Upload or photograph a card first.";

          return;

        }

        status.textContent =
          "Analyzing card...";

        setTimeout(
          function () {

            calculateRanges();

            result.style.display =
              "block";

            status.textContent =
              "Analysis complete.";

          },
          700
        );

      }
    );


    function calculateRanges() {

      /*
        CARDBID FORMULA

        Green:
        0% - 80% of market

        Yellow:
        81% - 100% of market

        Red:
        Over market value
      */

      const greenMax =
        Math.round(
          marketValue * 0.80
        );

      const yellowMin =
        greenMax + 1;

      const yellowMax =
        marketValue;

      const redMin =
        marketValue + 1;


      document.getElementById(
        "greenRange"
      ).textContent =
        "≤ $" + greenMax;


      document.getElementById(
        "yellowRange"
      ).textContent =
        "$" +
        yellowMin +
        "–$" +
        yellowMax;


      document.getElementById(
        "redRange"
      ).textContent =
        "$" +
        redMin +
        "+";


      document.getElementById(
        "marketValueDisplay"
      ).textContent =
        "$" + marketValue;

    }

  </script>

</body>
</html>
